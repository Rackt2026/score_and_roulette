/* Keep the live scoreboard inside the available screen. */
.score-active{height:100dvh;min-height:360px;display:flex;flex-direction:column;overflow:hidden}
.score-active .topbar{min-height:56px;padding-top:8px;padding-bottom:8px;flex-shrink:0}
.score-active .brand-icon{width:34px;height:34px;border-radius:11px}
.score-active .brand{font-size:18px}
.score-active .brand small,.score-active .header-note,.score-active .step-pill,.score-active .eyebrow,.score-active .page-heading p,.score-active .app-footer{display:none}
.score-active main{width:100%;max-width:1600px;padding:12px 20px 8px;flex:1;min-height:0;display:flex;flex-direction:column}
.score-active .page-heading{margin-bottom:10px;flex-shrink:0}
.score-active h1{font-size:24px;display:flex;align-items:center;gap:12px;line-height:1.3}
.board-members{font-size:14px;font-weight:650;letter-spacing:0;color:var(--muted);background:white;padding:3px 9px;border-radius:8px}
.score-active .score-toolbar{padding:8px 12px;border-radius:13px;flex-shrink:0;gap:8px;align-items:center}
.score-toolbar>div:first-child{display:flex;align-items:center;gap:12px}
.score-active .control-label{margin:0;white-space:nowrap}
.score-active .segmented{padding:3px;gap:2px;border-radius:9px}
.score-active .segmented button{padding:4px 17px;min-height:36px;border-radius:7px}
.score-active .score-actions{gap:8px}
.score-active .score-actions button{min-height:38px;padding:6px 12px}
.score-active .score-meta{margin:8px 1px;font-size:13px;line-height:1.4;flex-shrink:0}
.score-active .score-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--board-columns),minmax(0,1fr));grid-template-rows:repeat(var(--board-rows),minmax(118px,1fr));gap:8px;align-content:start;overflow:auto}
.score-active .score-card{padding:7px 8px;border-top-width:3px;border-radius:11px;max-height:160px;min-width:0;min-height:0;display:flex;flex-direction:column}
.score-active .score-card-top{gap:5px;flex-wrap:nowrap;flex-shrink:0;min-width:0}
.score-active .score-card-top h2{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.score-active .score-number{font-size:clamp(28px,4.5vh,46px);line-height:1.15;letter-spacing:-1px;margin:3px 0;flex:1;display:flex;align-items:center;justify-content:center;font-weight:850}
.score-active .score-number span{font-size:13px;margin-left:4px}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex-shrink:0}
.score-active .award-button{font-size:16px;min-height:40px;height:40px;border-radius:7px;gap:2px}
.score-active .mistake-button{font-size:12px;min-height:40px;height:40px;margin:0;border-radius:7px;gap:0;white-space:nowrap;padding:4px 2px;flex-direction:row}
.score-active .announcement{margin-top:6px;min-height:27px;height:27px;padding:3px 9px;flex-shrink:0;font-size:13px;line-height:1.4;border-radius:7px;overflow:hidden}
.score-active .announcement span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-active .dense-board{grid-template-rows:repeat(var(--board-rows),minmax(48px,1fr))}
.score-active .dense-board .score-card{padding:0;max-height:106px;border-top-width:3px}
.compact-player{border:0;background:transparent;width:100%;height:100%;min-height:44px;display:flex;flex-direction:column;gap:1px;padding:3px 5px;color:var(--ink)}
.compact-player:hover{background:#f1f5ff}
.compact-name{font-size:14px;line-height:1.3;font-weight:700;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.compact-score{font-size:clamp(20px,3.4vh,34px);line-height:1.1;font-weight:850;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.compact-score small{font-size:12px;font-weight:500;color:var(--muted)}
.compact-score svg{color:#b47700}
.score-dialog-actions{justify-content:stretch}
.score-dialog-actions>button{flex:1;min-height:56px}
@media(max-width:650px){.score-active main{padding:8px 10px 5px}.score-active .topbar{min-height:47px;padding:6px 12px}.score-active .brand-icon{width:29px;height:29px}.score-active .brand{font-size:16px}.score-active .page-heading{margin-bottom:7px}.score-active h1{font-size:21px}.score-active .score-toolbar{padding:6px 8px;flex-wrap:nowrap;gap:6px}.score-toolbar>div:first-child{gap:0}.score-active .control-label{display:none}.score-active .segmented button{padding:5px 10px;font-size:15px}.score-active .score-actions{gap:5px;flex-wrap:nowrap}.score-active .score-actions button{padding:5px 8px;gap:4px;font-size:13px;min-height:36px}.score-active .score-actions svg{width:15px}.score-active .score-meta{font-size:12px;margin:6px 0}.score-active .score-card{padding:6px;border-radius:9px}.score-active .score-number{font-size:34px}.score-active .score-card-top h2{font-size:14px}.score-active .score-grid{gap:8px}.score-active .announcement{font-size:12px}.compact-name{font-size:14px}.compact-score{font-size:24px}}
@media(max-width:360px){.score-active .score-actions .secondary{font-size:0;gap:0}.score-active .score-actions .secondary svg{width:18px}.score-active .segmented button{padding:5px 8px}}
.score-active .tight-board{grid-template-rows:repeat(var(--board-rows),minmax(38px,1fr))}
.score-active .tight-board .compact-player{min-height:34px;padding:1px 2px;gap:0}
.score-active .tight-board .compact-name{font-size:14px;line-height:1.1}
.score-active .tight-board .compact-score{font-size:18px;line-height:1;gap:2px}
.score-active .tight-board .compact-score small{font-size:12px}
.score-active .tight-board .compact-score svg{width:12px;height:12px}
/* Horizontal, automatically ranked score rows. */
.sound-toggle{flex-shrink:0;color:var(--blue);font-weight:700;white-space:nowrap}
.sound-toggle[aria-pressed=false]{color:var(--muted)}
.score-active .ranking-board{gap:6px;grid-template-rows:repeat(var(--board-rows),minmax(38px,1fr));align-content:start}
.score-active .ranking-row{padding:0;border:1px solid var(--line);border-left:4px solid var(--player-color);border-radius:9px;max-height:114px;display:flex;flex-direction:row;align-items:stretch;overflow:hidden;min-height:0;background:white}
.score-active .ranking-row.top-player{background:#fff9e8;border-color:#f1d584;border-left-color:#e4a90b}
.rank-player{display:flex;align-items:center;justify-content:flex-start;gap:9px;background:transparent;border:0;color:var(--ink);padding:6px 10px;min-width:0;flex:1;text-align:left;border-radius:5px;min-height:34px}
.rank-player:hover{background:#315bff08}
.row-rank{font-size:20px;font-weight:850;color:#62708a;white-space:nowrap;flex-shrink:0;min-width:32px;line-height:1.2}
.row-rank small{font-size:12px;margin-left:2px;font-weight:500}
.top-player .row-rank{color:#956900}
.row-name{font-size:16px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.row-score{font-size:30px;font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.1;flex-shrink:0;margin-left:auto;display:flex;align-items:baseline;gap:4px}
.row-score small{font-size:13px;font-weight:500;color:var(--muted)}
.top-ribbon{display:flex;align-items:center;gap:2px;flex-shrink:0;background:#f4bd36;color:#5d4000;font-size:12px;line-height:1.2;font-weight:900;letter-spacing:.4px;padding:6px 7px 8px;clip-path:polygon(0 0,100% 0,100% 100%,50% 83%,0 100%)}
.row-actions{display:flex;gap:5px;align-items:center;margin-right:7px;flex-shrink:0}
.row-add,.row-mistake{border:0;border-radius:7px;min-height:36px;padding:6px 9px;font-size:14px;font-weight:750}
.row-add{background:var(--player-color);color:white;gap:1px}
.row-mistake{background:#fff0ee;color:#a63830;font-size:12px}
.score-active .tight-board .rank-player{padding:3px 5px;gap:4px;flex-wrap:wrap;align-content:center}
.score-active .tight-board .row-rank{font-size:14px;min-width:19px}
.score-active .tight-board .row-name{font-size:14px}
.score-active .tight-board .row-score{font-size:20px;gap:2px}
.score-active .tight-board .top-ribbon{font-size:10px;padding:3px 4px 5px;gap:0}
.score-active .tight-board .top-ribbon svg{display:none}
@media(max-width:650px){.sound-toggle{padding:5px;gap:3px;font-size:12px}.score-active .topbar{gap:8px}.score-active .brand{font-size:15px}.score-active .brand-icon{width:26px;height:26px}.rank-player{gap:7px;padding:5px 8px}.row-name{font-size:14px}.row-rank{font-size:17px;min-width:25px}.row-score{font-size:25px}.top-ribbon{padding:4px 5px 6px;font-size:11px}.top-ribbon svg{display:none}.score-active .ranking-row{border-left-width:3px}}
.score-active .page-heading{position:absolute;width:1px;height:1px;padding:0;margin:0;overflow:hidden;clip-path:inset(50%)}
.score-active .brand{gap:9px}
.score-active .brand .board-members{font-size:13px;padding:2px 7px}
.score-active .tight-board .rank-player{flex-wrap:nowrap}
@media(max-width:360px){.score-active .brand-icon{display:none}.score-active .brand{font-size:14px;gap:5px}.sound-toggle span{display:none}}
.score-active .tight-board .rank-player{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:15px 18px;column-gap:2px;row-gap:0;padding:1px 3px;align-content:center;align-items:center;min-height:34px}
.score-active .tight-board .row-name{grid-column:1/-1;grid-row:1;display:block;width:100%;font-size:14px;line-height:15px}
.score-active .tight-board .row-rank{grid-column:1;grid-row:2;font-size:13px;min-width:0}
.score-active .tight-board .row-rank small{font-size:12px;margin-left:0}
.score-active .tight-board .top-ribbon{grid-column:2;grid-row:2;justify-self:start;font-size:10px;padding:2px 3px 4px}
.score-active .tight-board .row-score{grid-column:3;grid-row:2;justify-self:end;font-size:18px;line-height:18px;gap:1px;margin:0}
.score-active .tight-board .row-score small{font-size:12px}
.score-active .ranking-board{grid-template-rows:repeat(var(--board-rows),minmax(57px,var(--board-row-height)));align-content:start}
@media(max-width:650px){.score-active .score-toolbar{flex-wrap:wrap}.score-active .score-actions{margin-left:auto;flex-wrap:wrap}.score-active .clear-scores{font-size:13px}}
@media(max-width:420px){.score-active .score-toolbar>div:first-child{width:100%}.score-active .score-actions{width:100%;justify-content:flex-end}.score-active .score-actions .clear-scores{font-size:13px;gap:4px}}
/* A single vertical ranking with the existing compact row width. */
.score-active .ranking-board{grid-template-columns:minmax(0,var(--board-row-width));justify-content:center;overflow-x:hidden;overflow-y:auto;overflow-anchor:none;padding:0 8px 8px}
.score-active .ranking-row{position:relative;flex-shrink:0}

/* Always-visible touch controls on tablets and phones. */
.score-active .ranking-row{display:flex;flex-direction:column;min-height:100px;max-height:none}
.score-active .ranking-board{grid-template-rows:repeat(var(--board-rows),minmax(100px,var(--board-row-height)))}
.score-active .ranking-row .rank-player{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;padding:4px 10px;min-height:40px;flex:1;width:100%}
.score-active .ranking-row .row-rank{font-size:17px;min-width:29px}
.score-active .ranking-row .row-name{font-size:16px;line-height:1.3;flex:1;width:auto}
.score-active .ranking-row .row-score{font-size:25px;line-height:1.1;gap:3px;margin-left:auto}
.score-active .ranking-row .top-ribbon{font-size:11px;padding:4px 5px 6px}
.score-active .ranking-row .row-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px 7px;margin:0;width:100%;flex-shrink:0}
.score-active .ranking-row .row-actions button{min-height:44px;font-size:15px;line-height:1.2;padding:6px 8px;touch-action:manipulation;white-space:nowrap}
.score-active .row-add{gap:4px}
@media(max-width:650px){
  .score-active .ranking-board{grid-template-columns:minmax(0,1fr)}
  .score-active .ranking-row .row-name{font-size:15px}
  .score-active .ranking-row .rank-player{padding-left:8px;padding-right:8px}
}

/* Roomy, separated controls with immediate visual confirmation. */
.score-active .ranking-board{gap:12px;grid-template-rows:repeat(var(--board-rows),minmax(136px,var(--board-row-height)));padding-bottom:12px}
.score-active .ranking-row{min-height:136px;border-radius:14px}
.score-active .ranking-row .rank-player{min-height:48px;padding:7px 12px}
.score-active .ranking-row .row-actions{gap:14px;padding:0 10px 10px}
.score-active .ranking-row .row-actions button{min-height:64px;padding:10px 8px;border-radius:12px;font-size:19px;font-weight:800;gap:6px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:background .12s,box-shadow .12s,transform .12s}
.score-active .ranking-row .row-add{background:#315bff;box-shadow:0 3px 0 #193cb0}
.score-active .ranking-row .row-mistake{background:#fff2ed;border:2px solid #d9947f;color:#a13022;box-shadow:0 3px 0 #e7c4b9}
.score-active .ranking-row .row-actions button:not(:disabled):active{transform:translateY(3px);box-shadow:none;filter:brightness(.88)}
.score-active .ranking-row .row-add.tap-confirmed{background:#08735c;box-shadow:0 0 0 3px #8de1c4}
.score-active .ranking-row .row-mistake.tap-confirmed{background:#ffe0ce;border-color:#ae4932;box-shadow:0 0 0 3px #f1b899}
@media(max-width:360px){.score-active .ranking-row .row-actions{gap:10px;padding-left:8px;padding-right:8px}.score-active .ranking-row .row-actions button{font-size:16px;gap:3px}.score-active .ranking-row .row-actions svg{width:20px;height:20px}}
